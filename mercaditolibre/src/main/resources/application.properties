spring.application.name=mercaditolibre

#Asignación de puerto
server.port=8085
#Conexi+on a la base de datos
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mercaditoLibre_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Mexico_City
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Subida de imagenes de producto. El servicio rechaza mas de 2 MB; aqui se deja algo de holgura
#para que el limite lo aplique la validacion y no un error crudo de Tomcat.
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB

##Coniguración de JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#JWT. La clave NUNCA va aqui: se lee del entorno. HS256 exige 32+ caracteres.
#Si queda vacia la app arranca con una clave aleatoria y avisa por log (las sesiones no sobreviven al reinicio).
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

#Credenciales de prueba. Notas: la app no las lee de aquí.
# admin     / admin123 -> ROLE_ADMIN   (lo crea AdminSeeder al arrancar)
# juanperez / juan123  -> ROLE_CLIENTE (creado por POST /api/v1/auth/registro)

#CORS. Origenes que pueden llamar a la API, separados por comas. Admite comodines: https://*.vercel.app
#En el host hay que apuntarlo al dominio real del frontend, o el navegador bloqueara las peticiones.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5174,https://localhost:5174}

#Rol, nombre, correo, contraseña, numero de telefono y direccion (Estos dos ultimos para su direccion de entrega)

#Stripe. Las claves NUNCA van aquí: se leen del entorno (.env en local, variables del host en produccion).
#Ambas deben ser de la MISMA cuenta y el MISMO modo (pk_test_ con sk_test_).
stripe.apikey.secret=${STRIPE_SECRET_KEY:}
stripe.apikey.public=${STRIPE_PUBLIC_KEY:}

#Simulador de pagos: marca ventas como pagadas sin cobrar. Solo para demos locales, jamas en el host.
app.pagos.simulador=${PAGOS_SIMULADOR:false}







